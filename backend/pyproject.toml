[project]
name = "savesync"
version = "0.1.0"
description = "Sync a game save folder between two machines through a shared relay folder."
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.30",
    # uvicorn ships no WebSocket implementation of its own; without this the
    # live-update endpoint fails its upgrade and the UI falls back to polling.
    "websockets>=12",
    "pydantic>=2.7",
    "typer>=0.12",
    # For the cloud account backend: httpx is the client (HttpRemote, account_client),
    # bcrypt hashes passwords server-side. Both needed whenever cloud profiles or
    # `savesync serve` are used, so they are core rather than an optional extra.
    "httpx>=0.27",
    "bcrypt>=4.0",
]

[project.optional-dependencies]
desktop = ["pywebview>=5.1"]
dev = ["pytest>=8.0"]
build = ["pyinstaller>=6.0"]

[project.scripts]
savesync = "savesync.cli:app"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["savesync*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
